[package]
name = "moon-cast"
version = "1.0.2"
description = "MoonCast - A cross-platform file casting tool"
authors = ["ethan321222 <ethan321222@gmail.com>"]
license = "MIT"
repository = "https://github.com/ethan321222/moon-cast"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moon_cast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"
mime_guess = "2"
mime = "0.3"
chrono = "0.4"
percent-encoding = "2"
futures-core = "0.3"
futures-util = "0.3"
http-body-util = "0.1"
dirs = "6"
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
opener = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

